<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: Mobil çentik ve kenar boşluklarını sıfırlar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#140D13" />
    
    <!-- FAVICON VE MANIFEST (Göreceli Yol) -->
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="manifest" href="manifest.json" />

    <title>Color Harmony M3</title>

    <!-- GLOBAL RENK VE KENAR SIFIRLAMA STİLLERİ -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background-color: #140D13 !important;
        color-scheme: dark;
        overflow-x: hidden;
      }

      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background-color: #140D13;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Kaydı -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('sw.js', { scope: './' })
            .then((reg) => console.log('SW Başarıyla Kaydoldu:', reg.scope))
            .catch((err) => console.error('SW Kayıt Hatası:', err));
        });
      }
    </script>
  </body>
</html>
